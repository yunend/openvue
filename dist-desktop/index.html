<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/tauri-BqBfGjI2.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenVue - Desktop</title>
  <style>
    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: linear-gradient(135deg, #e8eaf6 0%, #c5cae9 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }
    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .loader {
      width: 50px;
      height: 50px;
      border: 4px solid #c5cae9;
      border-top-color: #3f51b5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      margin-top: 20px;
      color: #3949ab;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 14px;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-DqtdQxwY.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CgGrqtPf.css">
</head>
<body>
  <div id="loading-screen">
    <div class="loader"></div>
    <div class="loading-text">正在启动 Tauri 控制台...</div>
  </div>
  <div id="app" style="display: none;"></div>
</body>
</html>
