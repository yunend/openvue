<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <!-- 允许移动端双指缩放，给 Office Viewer 足够的放大空间 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0, minimum-scale=0.5, user-scalable=yes, viewport-fit=cover">
    <title>Office 查看器</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            /* 动态视口高度：解决移动端地址栏导致的高度问题 */
            height: 100vh;
            height: 100dvh; /* 动态视口高度，现代浏览器支持 */
            min-height: -webkit-fill-available; /* iOS Safari */
            /* 允许捏合缩放，overflow: hidden 会裁掉缩放后的内容 */
            overflow: auto;
            /* 禁止浏览器默认的双击缩放，保留捏合缩放（更流畅） */
            touch-action: manipulation;
            background: #f5f5f5;
        }
        #container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: -webkit-fill-available;
            position: fixed;
            top: 0;
            left: 0;
        }
        #viewer {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            border: none;
            display: block;
            /* 让 iframe 内部的触摸事件（包括捏合缩放）正常传递 */
            touch-action: auto;
        }
        .tip {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
            color: #999;
            background: rgba(255,255,255,0.8);
            padding: 4px 8px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 9999;
        }
        /* 移动端适配 */
        @media (max-width: 768px) {
            .mobile-tip {
                padding: 20px;
                text-align: center;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }
            .mobile-tip .icon {
                font-size: 64px;
                margin-bottom: 16px;
            }
            .mobile-tip h2 {
                color: #333;
                margin-bottom: 12px;
                font-size: 18px;
                word-break: break-all;
            }
            .mobile-tip p {
                color: #666;
                margin-bottom: 24px;
                font-size: 14px;
                line-height: 1.6;
            }
            .mobile-tip a.btn {
                display: inline-block;
                padding: 12px 32px;
                background: #0078d4;
                color: #fff;
                text-decoration: none;
                border-radius: 4px;
                font-size: 16px;
                -webkit-tap-highlight-color: transparent;
            }
            .mobile-tip a.btn:active {
                background: #106ebe;
            }
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <script>
        function getQueryParams() {
            return new URLSearchParams(location.search);
        }

        function getFileExtension(filePath) {
            const pathWithoutQuery = filePath.split('?')[0].split('#')[0];
            const ext = pathWithoutQuery.substring(pathWithoutQuery.lastIndexOf('.') + 1).toLowerCase();
            return ext;
        }

        function getOfficeType(filePath) {
            const ext = getFileExtension(filePath);
            if (ext === 'doc' || ext === 'docx') return 'word';
            if (ext === 'xls' || ext === 'xlsx' || ext === 'csv') return 'excel';
            if (ext === 'ppt' || ext === 'pptx') return 'ppt';
            return null;
        }

        // 修复移动端视口高度：用 JS 动态设置 CSS 变量，处理地址栏收起/展开
        function fixViewportHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', vh + 'px');
        }
        fixViewportHeight();
        window.addEventListener('resize', fixViewportHeight);
        window.addEventListener('orientationchange', fixViewportHeight);

        window.addEventListener('DOMContentLoaded', function () {
            const queryParams = getQueryParams();
            const filePath = queryParams.has('path') ? queryParams.get('path') : '';

            if (!filePath) {
                document.getElementById('container').innerHTML = '<p style="padding:20px;text-align:center;color:#666;">请通过 path 参数指定 Office 文件路径</p>';
                return;
            }

            const container = document.getElementById('container');
            const officeType = getOfficeType(filePath);

            if (!officeType) {
                container.innerHTML = '<div class="mobile-tip"><p style="padding:40px;text-align:center;color:#666;">不支持的文件类型</p></div>';
                return;
            }

            const fullUrl = window.location.origin + filePath;

            if (officeType === 'word') {
                // Word 文档：使用 iframe 嵌入 Office Online Viewer
                const officeViewerUrl = 'https://view.officeapps.live.com/op/embed.aspx?src='
                    + encodeURIComponent(fullUrl)
                    + '&wdEmbed=0';

                container.innerHTML = '<iframe id="viewer" allow="fullscreen; autoplay; clipboard-write" style="width:100%;height:100vh;height:calc(var(--vh) * 100);border:none;display:block;"></iframe>';
                document.getElementById('viewer').src = officeViewerUrl;
            } else {
                // Excel / PPT：直接跳转 Office Online Viewer（不使用 iframe）
                const viewUrl = 'https://view.officeapps.live.com/op/view.aspx?src='
                    + encodeURIComponent(fullUrl);
                const fileName = filePath.split('/').pop().split('?')[0].split('#')[0];

                // 延迟跳转，给用户显示加载提示（移动端体验更好）
                container.innerHTML = `
                    <div class="mobile-tip">
                        <div class="icon">📊</div>
                        <h2>${fileName}</h2>
                        <p>正在打开 Office Online 查看器...</p>
                        <p style="font-size:12px;color:#999;">如未自动跳转，请点击下方按钮</p>
                        <a class="btn" href="${viewUrl}" target="_blank">打开文件</a>
                    </div>
                `;
                // 自动跳转
                setTimeout(function () {
                    window.location.href = viewUrl;
                }, 500);
            }
        });
    </script>
</body>
</html>
