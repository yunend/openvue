<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-plugin</title>
    <script src="tailwind.js"></script>
    <link rel="stylesheet" href="./katex.min.css">
    <link rel="shortcut icon" href="./logo.ico" type="image/x-icon">

    <!-- 延迟加载核心库 -->
    <script defer src="./marked.min.js"></script>
    <script defer src="./katex.min.js"></script>
    
    <!-- Mermaid 懒加载：仅在需要时加载 -->

    <style>
        :root {
            --c-heading: #1e293b;
            --c-text: #334155;
            --c-muted: #475569;
            --c-light: #64748b;
            --c-border: #e2e8f0;
            --c-bg: #f1f5f9;
            --c-blue: #2563eb;
            --c-blue-dk: #1d4ed8;
            --c-blue-br: #3b82f6;
            --c-scroll: #94a3b8;
            --c-scroll-hv: #64748b;
            --c-pre-bg: #1e293b;
            --c-pre-text: #e2e8f0;
        }

        /* Markdown 内容样式 */
        .markdown-body { line-height:1.8; color:var(--c-text); }
        .markdown-body h1 { font-size:2em; font-weight:700; margin-top:1.5em; margin-bottom:.5em; padding-bottom:.3em; border-bottom:2px solid var(--c-border); color:var(--c-heading); }
        .markdown-body h2 { font-size:1.5em; font-weight:600; margin-top:1.4em; margin-bottom:.4em; padding-bottom:.2em; border-bottom:1px solid var(--c-border); color:var(--c-heading); }
        .markdown-body h3 { font-size:1.25em; font-weight:600; margin-top:1.2em; margin-bottom:.3em; color:var(--c-heading); }
        .markdown-body h4, .markdown-body h5, .markdown-body h6 { font-weight:600; margin-top:1em; margin-bottom:.3em; color:var(--c-heading); }
        .markdown-body p { margin-bottom:1em; }
        .markdown-body a { color:var(--c-blue); text-decoration:underline; }
        .markdown-body a:hover { color:var(--c-blue-dk); }
        .markdown-body ul, .markdown-body ol { margin-bottom:1em; padding-left:2em; }
        .markdown-body li { margin-bottom:.3em; }
        .markdown-body blockquote { margin:1em 0; padding:.5em 1em; border-left:4px solid var(--c-blue-br); background-color:var(--c-bg); border-radius:0 .5rem .5rem 0; color:var(--c-muted); }
        .markdown-body code { background-color:var(--c-bg); padding:.2em .4em; border-radius:.25rem; font-size:.875em; font-family:'Courier New', Courier, monospace; color:#dc2626; }
        .markdown-body pre { background-color:var(--c-pre-bg); color:var(--c-pre-text); padding:1em; border-radius:.5rem; overflow-x:auto; margin-bottom:1em; }
        .markdown-body pre code { background:transparent; padding:0; border-radius:0; color:inherit; font-size:.9em; }
        .markdown-body table { width:100%; border-collapse:collapse; margin-bottom:1em; }
        .markdown-body th, .markdown-body td { border:1px solid #cbd5e1; padding:.5em .75em; text-align:left; }
        .markdown-body th { background-color:var(--c-bg); font-weight:600; }
        .markdown-body tr:nth-child(even) { background-color:#f8fafc; }
        .markdown-body img { max-width:100%; height:auto; border-radius:.5rem; margin:1em 0; }
        .markdown-body hr { border:none; border-top:1px solid var(--c-border); margin:2em 0; }
        .markdown-body strong { font-weight:700; }
        .markdown-body em { font-style:italic; }
        .markdown-body > :first-child { margin-top:0; }
        .markdown-body > :last-child { margin-bottom:0; }

        /* Mermaid 图表样式 */
        .mermaid { background-color:#f8fafc; border-radius:.5rem; padding:1.5rem; margin:1em 0; text-align:center; border:1px solid var(--c-border); }
        .mermaid svg { max-width:100%; height:auto; }

        /* ========== 页面布局：左目录 + 右主体 ========== */
        .page-layout {
            display: flex;
            flex: 1;
            width: 100%;
            padding: 1.5rem 0;
            gap: 0;
        }

        /* 目录侧边栏 */
        .toc-container {
            flex-shrink: 0;
            width: 280px;
            position: sticky;
            top: 0;
            height: fit-content;
            max-height: calc(100vh - 2rem);
            transition: width 0.3s ease, opacity 0.3s ease, margin 0.3s ease, padding 0.3s ease;
            overflow: hidden;
            margin-right: -0.5rem; /* 让目录略微向右侵入，消除缝隙 */
            z-index: 1;
        }

        .toc-container.collapsed {
            width: 0;
            min-width: 0;
            opacity: 0;
            margin: 0;
            padding: 0;
        }

        .toc-sidebar {
            background-color: #ffffff;
            border-radius: 0.75rem 0 0 0.75rem;
            box-shadow: -2px 4px 12px rgba(0, 0, 0, 0.08);
            padding: 1rem;
            max-height: inherit;
            overflow-y: auto;
        }

        /* 目录折叠状态 */
        .toc-container.collapsed ~ .content-area #md-content {
            border-radius: 0 0.75rem 0.75rem 0.75rem;
        }

        .toc-sidebar::-webkit-scrollbar { width:16px; }
        .toc-sidebar::-webkit-scrollbar-track { background:var(--c-bg); border-radius:5px; }
        .toc-sidebar::-webkit-scrollbar-thumb { background:var(--c-scroll); border-radius:5px; border:2px solid var(--c-bg); }
        .toc-sidebar::-webkit-scrollbar-thumb:hover { background:var(--c-scroll-hv); }

        .toc-header {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1e293b;
            padding-bottom: 0.6rem;
            margin-bottom: 0.75rem;
            border-bottom: 2px solid #3b82f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 折叠/展开切换按钮 */
        .collapse-btn {
            background:none; border:none; color:var(--c-light);
            cursor:pointer; padding:0; font-size:1.1rem; line-height:1;
            transition:transform .2s, color .2s;
        }
        .collapse-btn:hover { color:var(--c-blue); }

        .toc-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .toc-list li {
            margin-bottom: 0.15rem;
        }
        .toc-list a {
            display: block;
            padding: 0.35rem 0.6rem;
            color: #475569;
            text-decoration: none;
            border-radius: 0.375rem;
            font-size: 0.98rem;
            line-height: 1.5;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            word-break: break-all;
        }
        .toc-list a:hover {
            background-color: #eff6ff;
            color: #2563eb;
            border-left-color: #3b82f6;
        }
        .toc-list a.active {
            background-color: #dbeafe;
            color: #1d4ed8;
            border-left-color: #2563eb;
            font-weight: 600;
        }

        /* 目录缩进层级 */
        .toc-level-1 {
            padding-left: 0;
            font-weight: 700;
            font-size: 1.08rem;
            color: #1e293b;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            margin-top: 0.25rem;
            border-bottom: 1px solid #e2e8f0;
        }
        .toc-level-2 { padding-left: 0.75rem; }
        .toc-level-3 { padding-left: 1.5rem; }
        .toc-level-4 { padding-left: 2.25rem; }
        .toc-level-5 { padding-left: 3rem; }
        .toc-level-6 { padding-left: 3.75rem; }

        /* 一级标题特殊的 hover/active 效果 */
        .toc-list a.toc-level-1:hover {
            background-color: #e0e7ff;
            border-left-color: #6366f1;
            color: #4338ca;
        }
        .toc-list a.toc-level-1.active {
            background-color: #c7d2fe;
            border-left-color: #4f46e5;
            color: #3730a3;
        }

        .toc-empty { color:var(--c-scroll); font-size:.9rem; text-align:center; padding:.5rem; }

        .expand-toc-btn {
            flex-shrink:0; align-self:flex-start;
            background:#fff; border:none; border-radius:.5rem;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
            cursor:pointer; padding:.75rem .4rem; color:var(--c-light);
            transition:color .2s; font-size:1.1rem;
            display:flex; align-items:center; justify-content:center;
        }
        .expand-toc-btn:hover { color:var(--c-blue); }

        /* 主内容区域 */
        .content-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-left: 0.25rem; /* 轻微重叠，消除缝隙 */
        }

        /* 电脑屏幕下限制内容最大宽度 */
        @media (min-width: 1200px) {
            .content-area {
                max-width: 1200px;
                margin: 0 auto;
            }
            
            #md-content {
                max-width: 900px;
            }
        }

        /* 目录展开时：内容卡片左侧直角，与目录无缝贴合 */
        .page-layout:not(:has(.toc-container.collapsed)) .content-area #md-content {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }

        /* 响应式：手机端隐藏目录和切换按钮 */
        @media (max-width: 767px) {
            .toc-container,
            .expand-toc-btn {
                display: none !important;
            }
            .page-layout {
                padding: 1rem 0.75rem;
                gap: 0;
            }
        }

        /* 平滑滚动 */
        html {
            scroll-behavior: smooth;
        }
        /* 为标题添加偏移 */
        .markdown-body h1[id],
        .markdown-body h2[id],
        .markdown-body h3[id],
        .markdown-body h4[id],
        .markdown-body h5[id],
        .markdown-body h6[id] {
            scroll-margin-top: 5rem;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 flex flex-col">
    <!-- 导航栏 -->
    <nav class="w-full bg-blue-700">
        <section class="h-20 w-10/12 mx-auto font-mono text-white flex items-center gap-x-3">
            <span class="text-xl font-black tracking-wider text-yellow-400">MD</span>
            <ul class="flex gap-x-5 mx-3 items-center">
                <li><a href="/" class="block p-3 hover:bg-blue-900/50 transition-colors duration-200">Home</a></li>
                <li><a href="./editor.html" class="block p-3 hover:bg-blue-900/50 transition-colors duration-200">Editor</a></li>
            </ul>
        </section>
    </nav>

    <!-- 文件标题 -->
    <div id="current-file-title" class="text-center text-blue-600 font-bold text-2xl py-4">
    </div>

    <!-- 页面主体布局：左目录 + 右内容 -->
    <div class="page-layout">
        <!-- 目录侧边栏 -->
        <button id="expand-toc" class="expand-toc-btn hidden" title="展开目录">»</button>
        <aside id="toc-container" class="toc-container">
            <div class="toc-sidebar">
                <div class="toc-header">
                    <span>📑 目录</span>
                    <button id="collapse-btn" class="collapse-btn" title="折叠目录">«</button>
                </div>
                <ul id="toc-list" class="toc-list">
                    <li class="toc-empty">暂无目录</li>
                </ul>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="content-area">
            <!-- Markdown 内容容器 -->
            <div class="markdown-wrapper w-full min-h-[400px] relative p-0 overflow-hidden flex flex-col justify-start items-center">
                <div id="md-content" class="markdown-body w-full bg-white p-8 rounded-xl shadow-lg"></div>
            </div>

            <!-- 错误提示 -->
            <div id="error-message" class="hidden text-red-500 bg-red-50 border border-red-200 rounded-lg px-6 py-4 mt-4 text-center"></div>
        </main>
    </div>

    <!-- 页脚 -->
    <footer class="w-full bg-blue-700 text-white py-4">
        <p class="text-center">© 2026 yunend All rights reserved</p>
    </footer>

    <script>
        let mermaidLoaded = false;

        async function loadMermaid() {
            if (mermaidLoaded) return;
            
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = './mermaid.min.js';
                script.onload = () => {
                    mermaidLoaded = true;
                    mermaid.initialize({
                        startOnLoad: false,
                        theme: 'default',
                        securityLevel: 'loose',
                        flowchart: {
                            useMaxWidth: true,
                            htmlLabels: true,
                            curve: 'basis'
                        }
                    });
                    resolve();
                };
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        const $ = id => document.getElementById(id);

        function getQueryParams() {
            return new URLSearchParams(location.search);
        }

        function updateTitle(fp) { 
            $('current-file-title').textContent = fp ? fp.split(/[\\/]/).pop() : '未选择文件'; 
        }
        function showError(m) { 
            const e=$('error-message'); 
            e.textContent=m; 
            e.classList.remove('hidden'); 
        }
        function hideError() { 
            $('error-message').classList.add('hidden'); 
        }

        let mathPlaceholders = [];

        function protectMath(text) {
            mathPlaceholders = [];
            const push = (type, formula) => {
                // 替换弯引号为直引号，避免 KaTeX 报 Unicode 警告
                const fixed = formula.trim()
                    .replace(/[\u2018\u2019]/g, "'")   // ' ' → '
                    .replace(/[\u201C\u201D]/g, '"');   // " " → "
                mathPlaceholders.push({ type, formula: fixed });
                return `%%MATH_PLACEHOLDER_${mathPlaceholders.length - 1}%%`;
            };
            return text.replace(/\$\$([\s\S]*?)\$\$/g, (_, f) => push('display', f))
                    .replace(/\$([^$]+?)\$/g, (_, f) => push('inline', f));
}

        function restoreMath(html) {
            for (let i = 0; i < mathPlaceholders.length; i++) {
                const p = mathPlaceholders[i];
                try {
                    const r = katex.renderToString(p.formula, { displayMode: p.type === 'display', throwOnError: false });
                    const tag = p.type === 'display' ? 'div' : 'span';
                    const cls = p.type === 'display' ? ' class="katex-display"' : '';
                    html = html.replace(`%%MATH_PLACEHOLDER_${i}%%`, `<${tag}${cls}>${r}</${tag}>`);
                } catch (e) { console.error('KaTeX 渲染错误:', e); }
            }
            return html;
        }

        async function renderMermaidDiagrams() {
            const mermaidElements = document.querySelectorAll('.language-mermaid');
            
            for (let i = 0; i < mermaidElements.length; i++) {
                const element = mermaidElements[i];
                const code = element.textContent;
                const parent = element.parentElement;
                
                try {
                    const id = `mermaid-${i}`;
                    const { svg } = await mermaid.render(id, code);
                    
                    const mermaidDiv = document.createElement('div');
                    mermaidDiv.className = 'mermaid';
                    mermaidDiv.innerHTML = svg;
                    
                    parent.replaceWith(mermaidDiv);
                } catch (error) {
                    console.error('Mermaid 渲染失败:', error);
                    parent.innerHTML = `<pre class="text-red-500 text-sm">流程图语法错误: ${error.message}</pre>`;
                }
            }
        }

        /* ========== 目录相关功能 ========== */
        function slugify(text) {
            return text
                .toLowerCase()
                .trim()
                .replace(/[^\w\u4e00-\u9fa5\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-');
        }

        let headingIdMap = {}; // 记录已使用的 id，避免重复

        function generateToc() {
            const content = document.getElementById('md-content');
            const tocList = document.getElementById('toc-list');
            const headings = content.querySelectorAll('h1, h2, h3, h4, h5, h6');

            tocList.innerHTML = '';
            headingIdMap = {};

            if (headings.length === 0) {
                tocList.innerHTML = '<li class="toc-empty">暂无目录</li>';
                return;
            }

            headings.forEach((heading, index) => {
                const level = parseInt(heading.tagName.charAt(1));
                const text = heading.textContent.trim();

                // 生成唯一 id
                let baseId = slugify(text) || `heading-${index}`;
                let id = baseId;
                let counter = 1;
                while (headingIdMap[id]) {
                    id = `${baseId}-${counter++}`;
                }
                headingIdMap[id] = true;
                heading.id = id;

                // 创建目录项
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `#${id}`;
                a.textContent = text;
                a.className = `toc-level-${level}`;
                a.dataset.target = id;

                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
                    setActiveHeading(id);
                    scrollSidebarToLink(a);
                });

                li.appendChild(a);
                tocList.appendChild(li);
            });

            setupScrollSpy();
        }

        function setActiveHeading(id) {
            const links = document.querySelectorAll('#toc-list a');
            links.forEach(link => {
                link.classList.toggle('active', link.dataset.target === id);
            });
        }

        function setupScrollSpy() {
            const headings = document.querySelectorAll('#md-content h1, #md-content h2, #md-content h3, #md-content h4, #md-content h5, #md-content h6');
            if (headings.length === 0) return;

            window.addEventListener('scroll', () => {
                let currentId = '';

                headings.forEach(heading => {
                    // 用 getBoundingClientRect 避免父容器 position:relative 干扰
                    if (heading.getBoundingClientRect().top <= 120) {
                        currentId = heading.id;
                    }
                });

                if (currentId) {
                    setActiveHeading(currentId);
                    const activeLink = document.querySelector(`#toc-list a[data-target="${currentId}"]`);
                    if (activeLink) scrollSidebarToLink(activeLink);
                }
            }, { passive: true });
        }

        // 滚动侧边栏，让指定链接居中可见
        function scrollSidebarToLink(link) {
            const sidebar = document.querySelector('.toc-sidebar');
            if (!sidebar) return;
            const linkRect = link.getBoundingClientRect();
            const sidebarRect = sidebar.getBoundingClientRect();
            // 只在链接超出侧边栏可视区时滚动
            if (linkRect.top < sidebarRect.top + 10 || linkRect.bottom > sidebarRect.bottom - 10) {
                const offset = linkRect.top - sidebarRect.top;
                sidebar.scrollBy({ top: offset - sidebarRect.height / 2 + linkRect.height / 2, behavior: 'smooth' });
            }
        }

        function setupTocToggle() {
            const tocContainer = document.getElementById('toc-container');
            const collapseBtn = document.getElementById('collapse-btn');
            const expandBtn = document.getElementById('expand-toc');

            // 折叠目录
            collapseBtn.addEventListener('click', () => {
                tocContainer.classList.add('collapsed');
                expandBtn.classList.remove('hidden');
            });

            // 展开目录
            expandBtn.addEventListener('click', () => {
                tocContainer.classList.remove('collapsed');
                expandBtn.classList.add('hidden');
            });
        }

        async function loadMarkdown(filePath) {
            const mdContent = document.getElementById('md-content');

            if (!filePath) {
                mdContent.innerHTML = '<p class="text-gray-400 text-center py-20">请在URL中通过 <code>path</code> 参数指定Markdown文件路径</p>';
                updateTitle('');
                return;
            }

            mdContent.innerHTML = '';
            hideError();

            try {
                const response = await fetch(filePath);

                if (!response.ok) {
                    throw new Error(`无法加载文件 (HTTP ${response.status}: ${response.statusText})`);
                }

                const mdText = await response.text();

                if (typeof marked !== 'undefined') {
                    const protectedText = protectMath(mdText);
                    const html = marked.parse(protectedText);
                    mdContent.innerHTML = restoreMath(html);
                    
                    if (html.includes('language-mermaid')) {
                        await loadMermaid();
                        await renderMermaidDiagrams();
                    }
                } else {
                    mdContent.innerHTML = `<pre class="text-sm">${mdText}</pre>`;
                }

                updateTitle(filePath);
                // 渲染目录
                generateToc();
            } catch (error) {
                console.error('加载Markdown文件失败:', error);
                mdContent.innerHTML = '';
                showError(`加载Markdown文件失败：${error.message}`);
                updateTitle(filePath);
                document.getElementById('toc-list').innerHTML = '<li class="toc-empty">暂无目录</li>';
            } finally {
            }
        }

        window.addEventListener('DOMContentLoaded', function () {
            setupTocToggle();
            const q = new URLSearchParams(location.search);
            loadMarkdown(q.has('path') ? q.get('path') : '');
        });
    </script>
</body>
</html>
