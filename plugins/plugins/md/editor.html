<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD编辑器 - 插件</title>
    <script src="./tailwind.js"></script>
    <link rel="stylesheet" href="./katex.min.css">
    <link rel="shortcut icon" href="./logo.ico" type="image/x-icon">

    <!-- 延迟加载核心库 -->
    <script defer src="./marked.min.js"></script>
    <script defer src="./katex.min.js"></script>

    <style>
        /* 编辑器容器 */
        .editor-container {
            display: flex;
            height: calc(100vh - 180px);
            gap: 1rem;
        }

        /* 编辑区域 */
        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: white;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .editor-header {
            padding: 0.75rem 1.25rem;
            background-color: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
            font-weight: 600;
            color: #1e293b;
            font-size: 1.125rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-textarea {
            flex: 1;
            padding: 1.25rem;
            border: none;
            outline: none;
            resize: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #334155;
            background-color: #fafafa;
        }

        .editor-textarea::placeholder {
            color: #94a3b8;
        }

        /* 预览区域 */
        .preview-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: white;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .preview-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        /* Markdown 内容样式 */
        .markdown-body {
            line-height: 1.8;
            color: #334155;
        }

        .markdown-body h1 {
            font-size: 2em;
            font-weight: 700;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            padding-bottom: 0.3em;
            border-bottom: 2px solid #e2e8f0;
            color: #1e293b;
        }

        .markdown-body h2 {
            font-size: 1.5em;
            font-weight: 600;
            margin-top: 1.4em;
            margin-bottom: 0.4em;
            padding-bottom: 0.2em;
            border-bottom: 1px solid #e2e8f0;
            color: #1e293b;
        }

        .markdown-body h3 {
            font-size: 1.25em;
            font-weight: 600;
            margin-top: 1.2em;
            margin-bottom: 0.3em;
            color: #1e293b;
        }

        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            font-weight: 600;
            margin-top: 1em;
            margin-bottom: 0.3em;
            color: #1e293b;
        }

        .markdown-body p {
            margin-bottom: 1em;
        }

        .markdown-body a {
            color: #2563eb;
            text-decoration: underline;
        }

        .markdown-body a:hover {
            color: #1d4ed8;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin-bottom: 1em;
            padding-left: 2em;
        }

        .markdown-body ul {
            list-style-type: disc;
        }

        .markdown-body ol {
            list-style-type: decimal;
        }

        .markdown-body li {
            margin-bottom: 0.3em;
        }

        .markdown-body blockquote {
            margin: 1em 0;
            padding: 0.5em 1em;
            border-left: 4px solid #3b82f6;
            background-color: #f1f5f9;
            border-radius: 0 0.5rem 0.5rem 0;
            color: #475569;
        }

        .markdown-body code {
            background-color: #f1f5f9;
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-size: 0.875em;
            font-family: 'Courier New', Courier, monospace;
            color: #dc2626;
        }

        .markdown-body pre {
            background-color: #1e293b;
            color: #e2e8f0;
            padding: 1em;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1em;
        }

        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
            border-radius: 0;
            color: inherit;
            font-size: 0.9em;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1em;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid #cbd5e1;
            padding: 0.5em 0.75em;
            text-align: left;
        }

        .markdown-body th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        .markdown-body tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .markdown-body img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin: 1em 0;
        }

        .markdown-body hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 2em 0;
        }

        .markdown-body strong {
            font-weight: 700;
        }

        .markdown-body em {
            font-style: italic;
        }

        /* Mermaid 图表样式 */
        .mermaid {
            background-color: #f8fafc;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin: 1em 0;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .mermaid svg {
            max-width: 100%;
            height: auto;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background-color: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            padding: 0.5rem 0.75rem;
            background-color: white;
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            color: #475569;
            transition: all 0.2s;
            font-weight: 500;
        }

        .toolbar-btn:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        .toolbar-btn:active {
            transform: scale(0.95);
        }

        /* 状态栏 */
        .status-bar {
            padding: 0.5rem 1.25rem;
            background-color: #f1f5f9;
            border-top: 1px solid #e2e8f0;
            font-size: 0.875rem;
            color: #64748b;
            display: flex;
            justify-content: space-between;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .editor-container {
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 180px);
            }

            .editor-pane,
            .preview-pane {
                min-height: 400px;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 flex flex-col">
    <!-- 导航栏 -->
    <nav class="w-full bg-blue-700">
        <section class="h-20 w-10/12 mx-auto font-mono text-white flex items-center gap-x-3">
            <a class="text-4xl px-5 py-3 hover:translate-x-5 duration-300">MD</a>
            <ul class="hidden md:flex gap-x-5 mx-3 items-center">
                <li class="p-3 hover:bg-blue-900/50 cursor-pointer"><a href="/">主页</a></li>
                <li class="p-3 hover:bg-blue-900/50 cursor-pointer"><a href="../upload.html">上传文件</a></li>
                <li class="p-3 hover:bg-blue-900/50 cursor-pointer"><a href="./index.html">MD阅读</a></li>
            </ul>
        </section>
    </nav>

    <!-- 主内容区 -->
    <main class="flex-1 w-[95%] max-w-[1400px] mx-auto py-6">
        <!-- 工具栏 -->
        <div class="toolbar rounded-t-xl">
            <button onclick="insertText('**', '**')" class="toolbar-btn" title="加粗 (Ctrl+B)">B</button>
            <button onclick="insertText('*', '*')" class="toolbar-btn" title="斜体 (Ctrl+I)" style="font-style:italic;">I</button>
            <button onclick="insertText('~~', '~~')" class="toolbar-btn" title="删除线 (S)" style="text-decoration: line-through;">S</button>
            
            <div class="w-px h-6 bg-gray-300 self-center"></div>
            
            <button onclick="insertLine('# ')" class="toolbar-btn" title="标题 1">H1</button>
            <button onclick="insertLine('## ')" class="toolbar-btn" title="标题 2">H2</button>
            <button onclick="insertLine('### ')" class="toolbar-btn" title="标题 3">H3</button>
            
            <div class="w-px h-6 bg-gray-300 self-center"></div>
            
            <button onclick="insertLine('- ')" class="toolbar-btn" title="无序列表">• List</button>
            <button onclick="insertLine('1. ')" class="toolbar-btn" title="有序列表">1. List</button>
            <button onclick="insertLine('> ')" class="toolbar-btn" title="引用">Quote</button>
            
            <div class="w-px h-6 bg-gray-300 self-center"></div>
            
            <button onclick="insertLink()" class="toolbar-btn" title="插入链接">🔗 链接</button>
            <button onclick="insertImage()" class="toolbar-btn" title="插入图片">🖼️ 图片</button>
            <button onclick="insertCode()" class="toolbar-btn" title="代码块">💻 代码</button>
            <button onclick="insertTable()" class="toolbar-btn" title="表格">📊 表格</button>
            
            <div class="w-px h-6 bg-gray-300 self-center"></div>
            
            <button onclick="insertMathInline()" class="toolbar-btn" title="行内数学公式">∑ 行内公式</button>
            <button onclick="insertMathBlock()" class="toolbar-btn" title="块级数学公式">∫ 块级公式</button>
            
            <div class="w-px h-6 bg-gray-300 self-center"></div>
            
            <button onclick="clearEditor()" class="toolbar-btn text-red-500" title="清空内容">🗑️ 清空</button>
        </div>

        <!-- 编辑器容器 -->
        <div class="editor-container">
            <!-- 左侧编辑区 -->
            <div class="editor-pane">
                <div class="editor-header">
                    <span>✏️ 编辑</span>
                    <span id="char-count" class="text-sm text-gray-500">0 字符</span>
                </div>
                <textarea 
                    id="editor" 
                    class="editor-textarea"
                    placeholder="在此输入 Markdown 内容...

支持的语法示例：
# 标题
**加粗** *斜体* ~~删除线~~
- 列表项
> 引用
`行内代码`

[链接](url)
![图片](url)

$\int_{a}^{b} f(x) dx$

```mermaid
graph TD
    A --> B
```"
                    spellcheck="false"
                ></textarea>
                <div class="status-bar">
                    <span>Markdown</span>
                    <span id="line-count">第 1 行，第 1 列</span>
                </div>
            </div>

            <!-- 右侧预览区 -->
            <div class="preview-pane">
                <div class="editor-header">
                    <span>👁️ 预览</span>
                    <div class="flex gap-2">
                        <button onclick="downloadMarkdown()" class="text-sm px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors" title="下载 Markdown 文件">
                            ⬇️ 下载 MD
                        </button>
                        <button onclick="copyToClipboard()" class="text-sm px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700 transition-colors" title="复制到剪贴板">
                            📋 复制
                        </button>
                    </div>
                </div>
                <div id="preview" class="preview-content markdown-body"></div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="w-full bg-blue-700 text-white py-4">
        <p class="text-center">问君能有几多愁？</p>
    </footer>

    <script>
        let mermaidLoaded = false;
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        let debounceTimer = null;

        // 加载 Mermaid（懒加载）
        async function loadMermaid() {
            if (mermaidLoaded) return;
            
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = './mermaid.min.js';
                script.onload = () => {
                    mermaidLoaded = true;
                    mermaid.initialize({
                        startOnLoad: false,
                        theme: 'default',
                        securityLevel: 'loose',
                        flowchart: {
                            useMaxWidth: true,
                            htmlLabels: true,
                            curve: 'basis'
                        }
                    });
                    resolve();
                };
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        // 数学公式保护机制
        let mathPlaceholders = [];

        function protectMath(text) {
            mathPlaceholders = [];
            
            text = text.replace(/\$\$([\s\S]*?)\$\$/g, function(match, formula) {
                mathPlaceholders.push({ type: 'display', formula: formula.trim() });
                return `%%MATH_PLACEHOLDER_${mathPlaceholders.length - 1}%%`;
            });

            text = text.replace(/\$([^$]+?)\$/g, function(match, formula) {
                mathPlaceholders.push({ type: 'inline', formula: formula.trim() });
                return `%%MATH_PLACEHOLDER_${mathPlaceholders.length - 1}%%`;
            });

            return text;
        }

        function restoreMath(html) {
            for (let i = 0; i < mathPlaceholders.length; i++) {
                const placeholder = mathPlaceholders[i];
                try {
                    const rendered = katex.renderToString(placeholder.formula, {
                        displayMode: placeholder.type === 'display',
                        throwOnError: false
                    });
                    
                    if (placeholder.type === 'display') {
                        html = html.replace(`%%MATH_PLACEHOLDER_${i}%%`, `<div class="katex-display">${rendered}</div>`);
                    } else {
                        html = html.replace(`%%MATH_PLACEHOLDER_${i}%%`, rendered);
                    }
                } catch (e) {
                    console.error('KaTeX 渲染错误:', e);
                }
            }
            return html;
        }

        // 渲染 Mermaid 图表
        async function renderMermaidDiagrams() {
            const mermaidElements = document.querySelectorAll('.language-mermaid');
            
            for (let i = 0; i < mermaidElements.length; i++) {
                const element = mermaidElements[i];
                const code = element.textContent;
                const parent = element.parentElement;
                
                try {
                    const id = `mermaid-${i}`;
                    const { svg } = await mermaid.render(id, code);
                    
                    const mermaidDiv = document.createElement('div');
                    mermaidDiv.className = 'mermaid';
                    mermaidDiv.innerHTML = svg;
                    
                    parent.replaceWith(mermaidDiv);
                } catch (error) {
                    console.error('Mermaid 渲染失败:', error);
                    parent.innerHTML = `<pre class="text-red-500 text-sm">流程图语法错误: ${error.message}</pre>`;
                }
            }
        }

        // 更新预览
        function updatePreview() {
            const mdText = editor.value;
            
            if (!mdText.trim()) {
                preview.innerHTML = '<p class="text-gray-400 text-center py-20">在左侧输入 Markdown 内容，右侧将实时显示预览效果</p>';
                updateStats(mdText);
                return;
            }

            if (typeof marked !== 'undefined') {
                try {
                    const protectedText = protectMath(mdText);
                    const html = marked.parse(protectedText);
                    preview.innerHTML = restoreMath(html);
                    
                    if (html.includes('language-mermaid')) {
                        loadMermaid().then(() => renderMermaidDiagrams());
                    }
                } catch (error) {
                    console.error('Markdown 解析错误:', error);
                    preview.innerHTML = `<pre class="text-red-500">解析错误: ${error.message}</pre>`;
                }
            } else {
                preview.innerHTML = `<pre>${mdText}</pre>`;
            }
            
            updateStats(mdText);
        }

        // 防抖更新
        function debouncedUpdate() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(updatePreview, 150);
        }

        // 更新统计信息
        function updateStats(text) {
            document.getElementById('char-count').textContent = `${text.length} 字符`;
            
            const pos = editor.selectionStart;
            const lines = text.substr(0, pos).split('\n');
            document.getElementById('line-count').textContent = `第 ${lines.length} 行，第 ${lines[lines.length - 1].length + 1} 列`;
        }

        // 工具栏操作函数
        function insertText(before, after = '') {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const selectedText = editor.value.substring(start, end);
            const replacement = before + selectedText + after;
            
            editor.value = editor.value.substring(0, start) + replacement + editor.value.substring(end);
            
            // 设置光标位置
            editor.focus();
            editor.setSelectionRange(start + before.length, start + before.length + selectedText.length);
            
            debouncedUpdate();
        }

        function insertLine(prefix) {
            const start = editor.selectionStart;
            editor.value = editor.value.substring(0, start) + prefix + editor.value.substring(start);
            editor.focus();
            editor.setSelectionRange(start + prefix.length, start + prefix.length);
            debouncedUpdate();
        }

        function insertLink() {
            const selectedText = editor.value.substring(editor.selectionStart, editor.selectionEnd);
            const linkText = selectedText || '链接文字';
            insertText(`[${linkText}](', ')`);
        }

        function insertImage() {
            insertText('![', '](图片地址)');
        }

        function insertCode() {
            insertText('\n```\n', '\n```\n');
        }

        function insertTable() {
            const table = `
| 列1 | 列2 | 列3 |
|-----|-----|-----|
| 内容 | 内容 | 内容 |
| 内容 | 内容 | 内容 |`;
            insertLine(table);
        }

        function insertMathInline() {
            insertText(', ');
        }

        function insertMathBlock() {
            insertText('\n$\n', '\n$\n');
        }

        function clearEditor() {
            if (confirm('确定要清空所有内容吗？')) {
                editor.value = '';
                updatePreview();
            }
        }

        // 下载 Markdown 文件
        function downloadMarkdown() {
            const content = editor.value;
            const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'document.md';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 复制到剪贴板
        async function copyToClipboard() {
            try {
                await navigator.clipboard.writeText(editor.value);
                alert('已复制到剪贴板！');
            } catch (err) {
                console.error('复制失败:', err);
                alert('复制失败，请手动复制');
            }
        }

        // 键盘快捷键
        editor.addEventListener('keydown', function(e) {
            // Ctrl+B 加粗
            if (e.ctrlKey && e.key === 'b') {
                e.preventDefault();
                insertText('**', '**');
            }
            // Ctrl+I 斜体
            else if (e.ctrlKey && e.key === 'i') {
                e.preventDefault();
                insertText('*', '*');
            }
            // Ctrl+S 保存（下载）
            else if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                downloadMarkdown();
            }
        });

        // 监听输入事件
        editor.addEventListener('input', debouncedUpdate);
        editor.addEventListener('keyup', () => updateStats(editor.value));
        editor.addEventListener('click', () => updateStats(editor.value));

        // 从 URL 参数加载文件
        async function loadFileFromURL() {
            const params = new URLSearchParams(window.location.search);
            const path = params.get('path');
            
            if (path) {
                try {
                    const response = await fetch(path);
                    if (response.ok) {
                        const text = await response.text();
                        editor.value = text;
                        updatePreview();
                    }
                } catch (error) {
                    console.error('加载文件失败:', error);
                }
            }
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', function() {
            updatePreview();
            loadFileFromURL();
        });
    </script>
</body>
</html>
