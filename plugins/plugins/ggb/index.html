<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGB预览与编辑 - 插件</title>
    <script src="./tailwind.js"></script>
    <script defer src="./GeoGebra/deployggb.js"></script>
    <link rel="shortcut icon" href="./logo.ico" type="image/x-icon">
    
    <style>
        /* loading动画 */
        .sk-spinner-pulse {
            width: 150px;
            height: 150px;
            background-color: #10b981;
            border-radius: 100%;
            animation: sk-pulseScaleOut 1s infinite ease-in-out;
        }

        @keyframes sk-pulseScaleOut {
            0% { transform: scale(0); }
            100% { transform: scale(1); opacity: 0; }
        }

        #loading {
            position: absolute;
            z-index: 99999;
        }

        #ggb-element {
            position: relative;
        }

        .file-list-container {
            transition: left 0.3s ease;
        }

        .toggle-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 flex flex-col">
    <!-- 导航栏 -->
    <nav class="w-full bg-blue-700">
        <section class="h-20 w-10/12 mx-auto font-mono text-white flex items-center gap-x-3">
            <a class="text-4xl px-5 py-3 hover:translate-x-5 duration-300">GGB</a>
            <ul class="hidden md:flex gap-x-5 mx-3 items-center">
                <li class="p-3 hover:bg-blue-900/50 cursor-pointer"><a href="/">主页</a></li>
                <li class="p-3 hover:bg-blue-900/50 cursor-pointer"><a href="./GeoGebra/HTML5/5.0/GeoGebra.html" target="_blank">GGB本地</a></li>
            </ul>
            <button 
                onclick="toggleToolBar()"
                class="ml-auto px-3 py-2 bg-blue-500/40 border border-blue-400/40 rounded-lg hover:bg-blue-400/60 active:scale-95 transition-all text-white text-sm font-bold whitespace-nowrap"
                title="显示/隐藏工具按钮"
            >
                ✏️ 编辑
            </button>
        </section>
    </nav>

    <!-- 主内容区 -->
    <main class="flex-1 flex flex-col items-center justify-center py-8">
        <!-- 标题显示 -->
        <div id="current-file-title" class="text-center text-blue-600 font-bold text-2xl mb-6">
        </div>

        <!-- GGB容器 -->
        <div class="ggb-container w-[85%] max-w-[1280px] aspect-video relative p-0 overflow-hidden flex justify-center items-center border-3 border-blue-600 rounded-xl shadow-lg shadow-blue-600/30 transition-colors">
            <div id="loading" class="sk-spinner-pulse"></div>
            <div id="ggb-element"></div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="w-full bg-blue-700 text-white py-4">
        <p class="text-center">问世间，情为何物？</p>
    </footer>

    <script>
        const queryString = location.search;
        const queryParams = new URLSearchParams(queryString);
        let ggbFilePath = queryParams.has('path') ? queryParams.get('path') : "";

        let ggbAppletConfig = {
            "appName": "classic",
            "scaleContainerClass": "ggb-container",
            "showToolBar": false,
            "showAlgebraInput": false,
            "showMenuBar": false,
            "filename": ggbFilePath,
            "width": 1280,
            "height": 720,
            "borderColor": "#3c3c3c",
            "showFullscreenButton": true,
            showResetIcon: true,
            enableRightClick: false,
        };

        function initGGBApplet(config) {
            let applet = new GGBApplet(config);
            applet.setHTML5Codebase('./GeoGebra/HTML5/5.0/web3d/');
            applet.inject('ggb-element', 'html5');
            document.getElementById('loading').style.display = 'block';
            updateTitle(config.filename);
            observe();
            return applet;
        }

        function updateTitle(filePath) {
            const titleElement = document.getElementById('current-file-title');
            if (filePath) {
                const fileName = filePath.split('/').pop();
                titleElement.textContent = `${fileName}`;
            } else {
                titleElement.textContent = '未选择文件';
            }
        }

        window.addEventListener("DOMContentLoaded", function () {
           initGGBApplet(ggbAppletConfig);   
        });

        function toggleToolBar() {
            if (typeof ggbApplet !== 'undefined') {
                const isToolBarVisible = !ggbAppletConfig.showToolBar;
                ggbAppletConfig.showToolBar = isToolBarVisible;
                ggbAppletConfig.showAlgebraInput = isToolBarVisible;
                ggbAppletConfig.showMenuBar = isToolBarVisible;
                ggbAppletConfig.enableRightClick = isToolBarVisible;
                initGGBApplet(ggbAppletConfig);
            }
        }

        let loading = document.getElementById('loading');
        function observe() {
            const checkInterval = setInterval(() => {
                if (document.getElementsByClassName('EuclidianPanel').length > 0) {
                    loading.style.display = 'none';
                    clearInterval(checkInterval);
                }
            }, 100);
        }
    </script>
</body>
</html>
