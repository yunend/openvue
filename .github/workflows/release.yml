name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete existing release and tag
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          echo "=== Cleaning up old release for tag $TAG in $REPO ==="

          # 1. 直接通过 tag 名删除（-R 明确指定仓库，不依赖本地 git）
          echo "Step 1: Trying gh release delete $TAG"
          gh release delete "$TAG" -R "$REPO" --yes --cleanup-tag 2>/dev/null && echo "Deleted by tag name" || echo "Not found by tag name"

          # 2. API 兜底：用 REST API 列出所有 release，jq 筛选同名残留（tag 已断的 draft）
          echo "Step 2: API fallback search for orphaned releases matching $TAG"
          gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.name == \"$TAG\" or .tag_name == \"$TAG\") | .id" 2>/dev/null | while read -r RELEASE_ID; do
            echo "Deleting orphan release ID: $RELEASE_ID"
            gh api "repos/$REPO/releases/$RELEASE_ID" -X DELETE 2>/dev/null && echo "Deleted orphan release $RELEASE_ID" || echo "Failed to delete $RELEASE_ID"
          done

          echo "=== Cleanup complete ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: cleanup
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: 'windows'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            target: 'linux'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'macos-intel'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'macos-arm'

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'macos-arm' && 'aarch64-apple-darwin' || matrix.target == 'macos-intel' && 'x86_64-apple-darwin' || matrix.target == 'linux' && 'x86_64-unknown-linux-gnu' || 'x86_64-pc-windows-msvc' }}

      - name: Install dependencies (Windows)
        if: matrix.target == 'windows'
        run: |
          npm install

      - name: Install dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          npm install

      - name: Install dependencies (macOS)
        if: startsWith(matrix.target, 'macos')
        run: |
          npm install

      - name: Build Tauri app (Windows)
        if: matrix.target == 'windows'
        run: |
          # 直接调用 tauri build 并指定只生成 NSIS
          npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri app (Other platforms)
        if: matrix.target != 'windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Release ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
      
      - name: Upload Windows Release Asset
        if: matrix.target == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: "See the assets to download this version and install."
          files: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*
          update_existing_releases: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.target }}-build-logs
          path: |
            src-tauri/target/*/release/bundle/
            src-tauri/target/release/
          retention-days: 30