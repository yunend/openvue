name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete existing release and tag
        run: |
          echo "=== Cleaning up old release for tag ${{ github.ref_name }} ==="

          # 1. 直接通过 tag 名删除（正常情况）
          echo "Step 1: Trying gh release delete ${{ github.ref_name }}"
          gh release delete ${{ github.ref_name }} --yes 2>/dev/null && echo "Deleted by tag name" || echo "Not found by tag name"

          # 2. 如果上面没删掉（可能 tag 已被手动删除，release 变了 draft），
          #    再通过搜索 release 列表来删除残留的 draft release
          echo "Step 2: Searching for any remaining releases with tag ${{ github.ref_name }}"
          gh release list --limit 100 | grep "${{ github.ref_name }}" | while read -r release url; do
            echo "Found release: $release ($url)"
            # 从 URL 提取 release ID 或直接用 release 名删
            gh release delete "$release" --yes 2>/dev/null || true
          done
          
          echo "=== Cleanup complete ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: cleanup
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: 'windows'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            target: 'linux'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'macos-intel'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'macos-arm'

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'macos-arm' && 'aarch64-apple-darwin' || matrix.target == 'macos-intel' && 'x86_64-apple-darwin' || matrix.target == 'linux' && 'x86_64-unknown-linux-gnu' || 'x86_64-pc-windows-msvc' }}

      - name: Install dependencies (Windows)
        if: matrix.target == 'windows'
        run: |
          npm install

      - name: Install dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          npm install

      - name: Install dependencies (macOS)
        if: startsWith(matrix.target, 'macos')
        run: |
          npm install

      - name: Build Tauri app (Windows)
        if: matrix.target == 'windows'
        run: |
          # 直接调用 tauri build 并指定只生成 NSIS
          npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri app (Other platforms)
        if: matrix.target != 'windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Release ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
      
      - name: Upload Windows Release Asset
        if: matrix.target == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: "See the assets to download this version and install."
          files: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*
          update_existing_releases: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.target }}-build-logs
          path: |
            src-tauri/target/*/release/bundle/
            src-tauri/target/release/
          retention-days: 30