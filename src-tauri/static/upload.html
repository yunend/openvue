<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传 - OpenVue</title>
    <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
    <script src="/js/tailwind.js"></script>
</head>
<body class="min-h-screen bg-slate-100 flex flex-col">
    <!-- 导航栏 -->
    <nav class="w-full bg-blue-700">
        <section class="h-20 w-10/12 mx-auto font-mono text-white flex items-center gap-x-3">
            <a class="text-4xl px-5 py-3 hover:translate-x-5 duration-300" href="/">OpenVue</a>
            <ul class="hidden md:flex gap-x-5 mx-3 items-center">
                <li class="p-3 hover:bg-blue-900/50 cursor-pointer"><a href="/">主页</a></li>
                <li class="p-3 hover:bg-blue-900/50 cursor-pointer"><a href="upload.html">上传文件</a></li>
                <li class="p-3 hover:bg-blue-900/50 cursor-pointer"><a href="ggb/GeoGebra/HTML5/5.0/GeoGebra.html" target="_blank">GGB编辑</a></li>
            </ul>
        </section>
    </nav>

    <!-- 主内容区 -->
    <main class="flex-1 flex items-start justify-center py-12">
        <div class="w-10/12 max-w-2xl bg-white rounded-lg shadow-lg p-8">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">多文件上传</h2>
            
            <!-- 文件选择表单 -->
            <form id="uploadForm" class="space-y-4">
                <div>
                    <input 
                        type="file" 
                        id="fileInput" 
                        multiple
                        class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-medium file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer"
                    >
                </div>
                <button 
                    type="submit" 
                    id="uploadBtn"
                    class="w-full py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    上传文件
                </button>
            </form>

            <!-- 文件大小提示 -->
            <div class="mt-3 text-sm text-blue-600 text-center">每个文件不能大于1G</div>

            <!-- 进度条容器 -->
            <div id="progressContainer" class="mt-6 hidden">
                <h5 class="text-lg font-semibold text-gray-700 mb-3">上传进度</h5>
                <div id="currentFileInfo" class="text-sm text-gray-600 mb-2"></div>
                
                <!-- 进度条 -->
                <div class="w-full bg-gray-200 rounded-full h-6 mb-4 overflow-hidden">
                    <div id="progressBar" class="h-full bg-blue-600 transition-all duration-300" style="width: 0%"></div>
                </div>
                
                <div id="uploadStatus" class="text-sm"></div>
                
                <!-- 取消上传按钮 -->
                <div class="text-center mt-4">
                    <button 
                        id="cancelBtn" 
                        class="hidden px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 transition-colors"
                    >
                        取消上传
                    </button>
                </div>
            </div>

            <!-- 消息显示 -->
            <div id="message" class="mt-4 text-center text-gray-600"></div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="w-full bg-blue-700 text-white py-4">
        <p class="text-center">Email:303218145@qq.com</p>
    </footer>

    <script>
       document.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch('/api/upload-status');
                const data = await response.json();
                if(data.enabled)
                document.getElementById('message').textContent = "文件上传功能已启用";
                else 
                document.getElementById('message').textContent = "文件上传功能已禁用";
            } catch (error) {
                console.error('请求失败:', error);
                document.getElementById('message').textContent = '加载状态失败';
            }
            });

        class UploadManager {
            constructor() {
                this.totalFiles = 0;
                this.uploadedFiles = 0;
                this.totalSize = 0;
                this.uploadedSize = 0;
                this.currentFile = null;
            }

            // 检查上传功能是否启用
            async checkUploadEnabled() {
                try {
                    const response = await fetch('/api/upload-status');
                    const data = await response.json();
                    return data.enabled;
                } catch (error) {
                    console.error('检查上传状态失败:', error);
                    return false;
                }
            }

            // 格式化文件大小
            formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            // 更新当前文件信息
            updateCurrentFileInfo(file, progress) {
                const fileInfo = document.getElementById('currentFileInfo');
                const progressPercent = Math.round(progress * 100);
                
                // 更新进度条
                const progressBar = document.getElementById('progressBar');
                progressBar.style.width = progressPercent + '%';
                
                fileInfo.innerHTML = `
                    <strong>当前文件:</strong> ${file.name} 
                    <span class="text-gray-500">(${this.formatFileSize(file.size)})</span>
                    <span class="float-right">${progressPercent}%</span>
                `;
            }

            // 更新上传状态
            updateUploadStatus(message, type = 'info') {
                const statusDiv = document.getElementById('uploadStatus');
                let colorClass = 'text-gray-600';
                if (type === 'success') colorClass = 'text-green-600';
                else if (type === 'error') colorClass = 'text-red-600';
                else if (type === 'warning') colorClass = 'text-yellow-600';
                
                statusDiv.innerHTML = `<span class="${colorClass}">${message}</span>`;
            }

            // 开始上传
            async startUpload(files) {
                const uploadEnabled = await this.checkUploadEnabled();
                if (!uploadEnabled) {
                    document.getElementById('message').textContent = '文件上传功能已被禁用';
                    document.getElementById('uploadBtn').disabled = false;
                    return;
                }

                this.totalFiles = files.length;
                this.uploadedFiles = 0;
                this.totalSize = 0;
                this.uploadedSize = 0;
                this.currentXHR = null;

                for (let file of files) {
                    this.totalSize += file.size;
                }

                const progressContainer = document.getElementById('progressContainer');
                progressContainer.classList.remove('hidden');

                document.getElementById('uploadBtn').disabled = true;
                document.getElementById('cancelBtn').classList.remove('hidden');

                this.updateUploadStatus(`准备上传 ${this.totalFiles} 个文件，总大小: ${this.formatFileSize(this.totalSize)}`, 'info');

                this.uploadFilesSequentially(files);
            }

            // 顺序上传文件
            async uploadFilesSequentially(files) {
                for (let i = 0; i < files.length; i++) {
                    this.currentFile = files[i];
                    await this.uploadSingleFile(this.currentFile);
                    this.uploadedFiles++;
                }

                this.finishUpload();
            }

            // 上传单个文件
            uploadSingleFile(file) {
                return new Promise((resolve, reject) => {
                    const formData = new FormData();
                    formData.append('files', file);

                    const xhr = new XMLHttpRequest();
                    this.currentXHR = xhr;

                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const progress = e.loaded / e.total;
                            this.updateCurrentFileInfo(file, progress);
                        }
                    });

                    xhr.addEventListener('load', () => {
                        if (xhr.status === 200) {
                            this.uploadedSize += file.size;
                            this.updateUploadStatus(`文件 "${file.name}" 上传成功`, 'success');
                            resolve();
                        } else {
                            this.updateUploadStatus(`文件 "${file.name}" 上传失败: ${xhr.statusText}`, 'error');
                            reject(new Error(`上传失败: ${xhr.statusText}`));
                        }
                    });

                    xhr.addEventListener('error', () => {
                        this.updateUploadStatus(`文件 "${file.name}" 上传出错`, 'error');
                        reject(new Error('网络错误'));
                    });

                    xhr.addEventListener('abort', () => {
                        reject(new Error('上传已取消'));
                    });

                    xhr.open('POST', '/upload');
                    xhr.send(formData);
                });
            }

            // 完成上传
            finishUpload() {
                document.getElementById('uploadBtn').disabled = false;
                document.getElementById('cancelBtn').classList.add('hidden');

                if (this.uploadedFiles === this.totalFiles) {
                    this.updateUploadStatus(`所有文件上传完成！共上传 ${this.uploadedFiles} 个文件，总大小: ${this.formatFileSize(this.uploadedSize)}`, 'success');
                    document.getElementById('fileInput').value = '';
                    setTimeout(() => {
                        document.getElementById('progressContainer').classList.add('hidden');
                    }, 5000);
                } else {
                    this.updateUploadStatus(`上传完成，共成功上传 ${this.uploadedFiles}/${this.totalFiles} 个文件`, 'warning');
                }
            }

            // 取消上传
            cancelUpload() {
                if (this.currentXHR) {
                    this.currentXHR.abort();
                    this.currentXHR = null;
                }
                this.updateUploadStatus('上传已取消', 'warning');
                document.getElementById('uploadBtn').disabled = false;
                document.getElementById('cancelBtn').classList.add('hidden');
            }
        }

        const uploadManager = new UploadManager();

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const files = document.getElementById('fileInput').files;
            if (files.length === 0) {
                document.getElementById('message').textContent = '请选择要上传的文件';
                return;
            }

            for (let file of files) {
                if (file.size > 1024 * 1024 * 1024) {
                    document.getElementById('message').textContent = `文件 "${file.name}" 超过1GB大小限制`;
                    return;
                }
            }

            document.getElementById('message').textContent = '';
            await uploadManager.startUpload(files);
        });

        document.getElementById('cancelBtn').addEventListener('click', function() {
            if (confirm('确定要取消上传吗？')) {
                uploadManager.cancelUpload();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (confirm('确定要取消上传吗？')) {
                    uploadManager.cancelUpload();
                }
            }
        });
    </script>
</body>
</html>
